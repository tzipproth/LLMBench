s it for 120 euros. Later he buys the same bicycle back for 140 euros and finally sells it again for 160 euros. How many euros of profit has he made in total?"},{"id":"NEW-029/free","tier":2,"rate":1,"q":"Leo\u0027s school is 2 km from his home. He starts walking to school, notices exactly halfway that he has forgotten his lunch, walks back home to fetch it and then walks all the way to school. How many kilometres does he walk in total?"},{"id":"NEW-072/mcq","tier":2,"rate":1,"q":"A sign hangs in the glass door of a shop. One side of the sign says OPEN, the other side says CLOSED. A customer standing outside in the street reads CLOSED. Which word does the shopkeeper read, who stands inside the shop and looks at the same sign?\n\nA. OPEN\nB. CLOSED\nC. both words\nD. neither word"},{"id":"NEW-074/mcq","tier":2,"rate":1,"q":"The children play hide-and-seek in the living room. Nico crouches behind the sofa. Ella stands on the staircase, from where she can look down behind the sofa. Tim stands in the doorway, where the sofa completely blocks his view of Nico. Nobody speaks or makes a sound. Who knows where Nico is hiding, apart from Nico himself?\n\nA. only Ella\nB. only Tim\nC. Ella and Tim\nD. neither of them"},{"id":"NEW-078/mcq","tier":2,"rate":1,"q":"Anna and Ben sit opposite each other at a small table and face each other. A candle stands on the table at Anna\u0027s left hand. From Ben\u0027s point of view, where is the candle?\n\nA. on his left\nB. on his right\nC. exactly in front of him\nD. behind him"},{"id":"NEW-091/mcq","tier":2,"rate":1,"q":"Three cars are parked side by side in front of a house. Seen from the street, the red car is on the left, the blue car in the middle and the green car on the right. You walk around the cars and now look at them from the house, facing the street. Which car is on your left now?\n\nA. the red car\nB. the blue car\nC. the green car"},{"id":"NEW-103/mcq","tier":2,"rate":1,"q":"Today is Wednesday. Which day of the week will i  many pupils play both?"},{"id":"NEW-054/mcq","tier":2,"rate":0.917,"q":"Two identical blocks of ice lie on two plates in a warm room. One block is tightly wrapped in a thick wool blanket, the other is left unwrapped. Which block takes longer to melt completely?\n\nA. the wrapped block\nB. the unwrapped block\nC. both take the same time\nD. cannot be determined"},{"id":"NEW-057/mcq","tier":2,"rate":0.917,"q":"Eight gear wheels are arranged in a row so that each gear meshes with the next one. The first gear turns clockwise. In which direction does the eighth gear turn?\n\nA. clockwise\nB. counterclockwise\nC. it cannot turn"},{"id":"NEW-060/mcq","tier":2,"rate":0.917,"q":"In January, Erik sits on the 30 cm thick ice of a frozen lake at -15 \u00B0C. He takes 4 ice cubes out of a bag and puts them on the ice next to his fishing hole. Then he fishes for 20 minutes without touching them. How many ice cubes lie next to the hole when he packs up?\n\nA. 0\nB. 2\nC. 4\nD. cannot be determined"},{"id":"NEW-067/mcq","tier":2,"rate":0.917,"q":"Jakob is 1.90 m tall and Emma is 1.60 m tall. They stand next to each other on a flat beach in the evening sun. Emma then climbs onto a wooden box that is 50 cm high. Whose head is higher above the sand now?\n\nA. Jakob\u0027s\nB. Emma\u0027s\nC. both are at the same height\nD. cannot be determined"},{"id":"NEW-068/free","tier":2,"rate":0.917,"q":"A lift is on the 3rd floor of a building. It goes up 4 floors, then down 6 floors, then up 2 floors, and finally down 1 floor. A sign in the lift says that it holds at most 8 people. On which floor is the lift now? Answer with the number of the floor."},{"id":"NEW-103/free","tier":2,"rate":0.917,"q":"Today is Wednesday. Which day of the week will it be 100 days from today? Answer with the day of the week."},{"id":"NEW-113/free","tier":2,"rate":0.917,"q":"A film in a cinema starts at 19:45. The film itself lasts 2 hours and 35 minutes, and there is one 15-minute break in the middle. At what time nd on the television a talk show with 4 guests is running. How many people are physically present in the room?"},{"id":"NEW-076/mcq","tier":2,"rate":0.833,"q":"It is a summer evening in central Europe, shortly before sunset. You stand in an open field, and your long shadow falls on the ground exactly behind you. In which direction are you facing?\n\nA. north\nB. east\nC. south\nD. west"},{"id":"NEW-092/mcq","tier":2,"rate":0.833,"q":"A clock with a transparent glass face hangs in a shop window, with its front facing the street. You stand inside the shop and see the clock from behind. In which direction do its hands appear to turn?\n\nA. clockwise\nB. counterclockwise\nC. they do not seem to move"},{"id":"NEW-114/mcq","tier":2,"rate":0.833,"q":"Five guests arrived at a party one after another. Anna arrived before Ben but after Carl. Dora arrived after Ben. Emil arrived before Carl. Who was the third guest to arrive?\n\nA. Anna\nB. Ben\nC. Carl\nD. Dora\nE. Emil"},{"id":"NEW-145/free","tier":2,"rate":0.833,"q":"Write the word \u0022stressed\u0022 backwards, letter by letter. Which English word do you get? Answer with the word."},{"id":"NEW-147/free","tier":2,"rate":0.833,"q":"Sort these five words alphabetically: pear, plum, pepper, pea, peach. Which word comes third? Answer with the word."},{"id":"MATH-003/free","tier":2,"rate":0.833,"q":"400 euros are invested at an interest rate of 5 % per year. The interest is added to the capital at the end of every year (compound interest). How many euros are in the account after exactly 3 years?"},{"id":"MATH-013/free","tier":2,"rate":0.833,"q":"A four-digit code is formed from the digits 1, 2, 3, 4, 5 and 6, and no digit may be used more than once. How many different codes are possible?"},{"id":"MATH-019/free","tier":2,"rate":0.833,"q":"Calculate 4368 \u00F7 56."},{"id":"T4-013/mcq","tier":2,"rate":0.833,"q":"Four colleagues live in the same street and work in the same office, which is 30 km away. Each of them owns a car that uses exactly 6 litres of petrol per 100 km. Because their working hours differ, each of them drives alone in his or her own car. How many litres of petrol are used in total to bring all four colleagues from their street to the office on Tuesday morning?\n\nA. 0.45 litres\nB. 1.8 litr\u2026"},{"id":"CS-003/altered-mcq","tier":2,"rate":0.75,"q":"A bat and a ball cost $1.10 in total. The bat costs $1.00. How much does the ball cost?\n\nA. $0.10\nB. $0.15\nC. $0.05\nD. $1.00"},{"id":"CS-005/free","tier":2,"rate":0.75,"q":"A snail sits at the bottom of a well that is 3 metres deep. Each day it climbs up 3 metres, and each night it slides back 2 metres. On which day does it reach the top?"},{"id":"CS-101/free","tier":2,"rate":0.75,"q":"Sally has 3 brothers. Each of her brothers has 2 sisters. How many sisters does Sally have?"},{"id":"CS-101/altered-free","tier":2,"rate":0.75,"q":"Sally has 3 brothers. Each of her brothers has 3 sisters. How many sisters does Sally have?"},{"id":"CS-104/mcq","tier":2,"rate":0.75,"q":"A rooster lays an egg exactly on the ridge of a symmetric roof. A strong wind is blowing from the east. Which way does the egg most likely roll?\n\nA. down the east side\nB. down the west side\nC. it stays on the ridge\nD. roosters do not lay eggs"},{"id":"CS-012/mcq","tier":2,"rate":0.75,"q":"Three identical candles are lit at the same moment. Later they are blown out one after another, each at a different time. Afterwards candle A is 12 cm long, candle B is 7 cm long and candle C is 3 cm long. Which candle was blown out first?\n\nA. A\nB. B\nC. C\nD. cannot be determined"},{"id":"CS-012/free","tier":2,"rate":0.75,"q":"Three identical candles are lit at the same moment. Later they are blown out one after another, each at a different time. Afterwards candle A is 12 cm long, candle B is 7 cm long and candle C is 3 cm long. Which candle was blown out first? Answer with the letter of the candle."},{"id":"CS-209/mcq","tier":2,"rate":0.75,"q":"A cup of hot tea and a cup of cold water are placed on a table in a room at 20 \u00B0C. After 24 hours, which is warmer?\n\nA. the tea\nB. the water\nC. both have about the same temperature\nD. cannot be determined"},{"id":"CS-304/free","tier":2,"rate":0.75,"q":"You want to paint the six faces of a cube so that faces that share an edge always have different colours. What is the smallest number of colours you need?"},{"id":"CS-309/free","tier":2,"rate":0.75,"q":"You are driving north. You turn left, then left again, and then right. In which direction are you driving now? Answer with north, east, south or west."},{"id":"NEW-006/mcq","tier":2,"rate":0.75,"q":"An electric train travels north at 100 km/h. The wind blows from the west at 20 km/h. In which direction does the smoke of the train drift?\n\nA. towards the north\nB. towards the south\nC. towards the east\nD. there is no smoke"},{"id":"NEW-008/altered-free","tier":2,"rate":0.75,"q":"A square room has 4 corners. In each corner sit 2 cats. Each cat can see 7 other cats. How many cats are in the room?"},{"id":"NEW-023/free","tier":2,"rate":0.75,"q":"A straight road is 100 metres long. On both sides of the road stands a row of trees: one tree every 10 metres, including one at each end of the road. How many trees are there in total?"},{"id":"NEW-024/free","tier":2,"rate":0.75,"q":"A guest checks into a hotel on 28 March and checks out on 3 April of the same year. How many nights does he stay?"},{"id":"NEW-051/mcq","tier":2,"rate":0.75,"q":"Which weighs more: one litre of liquid water or a solid block of ice with a volume of exactly one litre?\n\nA. the water\nB. the ice\nC. both weigh the same\nD. cannot be determined"},{"id":"NEW-066/mcq","tier":2,"rate":0.75,"q":"Ana\u0027s alarm clock is set to ring at 6:30 from Monday to Friday and is switched off at weekends. On Friday evening she goes to bed at midnight, very tired, and changes nothing. At what time does the alarm clock wake her on Saturday morning?\n\nA. at 6:30\nB. at 7:30\nC. at 9:00\nD. it does not ring on Saturday"},{"id":"NEW-073/mcq","tier":2,"rate":0.75,"q":"Grandpa Karl is deaf without his hearing aids, which lie upstairs in the bathroom. He sits in his armchair with his back to the front door and reads the newspaper. His grandson stands outside and rings the loud doorbell three times; there is no light signal. What does Karl most likely do in the next few seconds?\n\nA. he gets up and opens the door\nB. he keeps reading his newspaper\nC. he calls out \u0022C\u2026"},{"id":"NEW-076/free","tier":2,"rate":0.75,"q":"It is a summer evening in central Europe, shortly before sunset. You stand in an open field, and your long shadow falls on the ground exactly behind you. In which direction are you facing? Answer with north, east, south or west."},{"id":"NEW-088/free","tier":2,"rate":0.75,"q":"Which capital letter do you get when you rotate the capital letter N by 90 degrees on the page? Answer with the letter."},{"id":"CS-001/mcq","tier":2,"rate":0.667,"q":"A farmer stands on the left bank of a river with a wolf, a goat and a cabbage. His boat is large enough to carry him and all three of them at the same time. What is the minimum number of river crossings needed to bring everything to the right bank?\n\nA. 1\nB. 2\nC. 3\nD. 5\nE. 7\nF. It is impossible"},{"id":"CS-105/altered-free","tier":2,"rate":0.667,"q":"How many months of the year have exactly 28 days in a year that is not a leap year?"},{"id":"CS-010/mcq","tier":2,"rate":0.667,"q":"I put a marble into a drinking glass. I cover the glass with a piece of cardboard, turn it upside down, place it on the kitchen table and pull the cardboard out. Then I lift the glass straight up and put it into the cupboard. Where is the marble now?\n\nA. on the floor\nB. on the kitchen table\nC. in the cupboard, next to the glass\nD. on the cardboard\nE. in the glass"},{"id":"CS-210/mcq","tier":2,"rate":0.667,"q":"In the living room I put a coin into a cup, place the cup upside down on a plate and carry the plate with the cup into the kitchen. There I lift the cup and put only the cup into the dishwasher. Where is the coin now?\n\nA. on the plate in the kitchen\nB. on the kitchen floor\nC. in the living room\nD. in the cup in the dishwasher"},{"id":"CS-309/mcq","tier":2,"rate":0.667,"q":"You are driving north. You turn left, then left again, and then right. In which direction are you driving now?\n\nA. north\nB. east\nC. south\nD. west"},{"id":"NEW-063/free","tier":2,"rate":0.667,"q":"Maria\u0027s birthday cake has 8 burning candles on it. She blows once, and 5 of the candles go out. Nobody touches the cake. How many candles are on the cake now?"},{"id":"CS-002/mcq","tier":2,"rate":0.583,"q":"A boy is brought to the hospital after an accident. The surgeon, who is the boy\u0027s father, looks at him and says: \u0022I can\u0027t operate on this boy, he is my son.\u0022 How is the surgeon related to the boy?\n\nA. his mother\nB. his father\nC. his stepfather\nD. his grandfather\nE. not related\nF. cannot be determined"},{"id":"CS-104/altered-mcq","tier":2,"rate":0.583,"q":"A hen lays an egg exactly on the ridge of a symmetric roof. A strong wind is blowing from the east. Which way does the egg most likely roll?\n\nA. down the east side\nB. down the west side\nC. it stays on the ridge\nD. roosters do not lay eggs"},{"id":"NEW-146/free","tier":2,"rate":0.583,"q":"How many times does the letter \u0022s\u0022 occur in the word \u0022possessiveness\u0022?"},{"id":"CS-001/free","tier":2,"rate":0.5,"q":"A farmer stands on the left bank of a river with a wolf, a goat and a cabbage. His boat is large enough to carry him and all three of them at the same time. What is the minimum number of river crossings needed to bring everything to the right bank?"},{"id":"CS-106/free","tier":2,"rate":0.5,"q":"A hole 2 m long, 2 m wide and 2 m deep has just been dug and nothing has been put back into it. How many cubic metres of soil are in the hole?"},{"id":"T4-018/mcq","tier":2,"rate":0.5,"q":"On a moonless winter evening five friends sit in the windowless reading room of a mountain hut, each with a book: Ida with a crime novel, Omar with a cookbook, Pia with a travel guide, Sven with a volume of poems, and Hanna, who has been blind since birth, with a novel in Braille. All mobile phones lie switched off in a basket in the hall, as the hut rules demand, and there are no candles, lighter\u2026"},{"id":"CS-111/free","tier":3,"rate":1,"q":"A patch of water lilies doubles its area every day. On day 30 it covers the whole pond for the first time. On which day did it cover half of the pond?"},{"id":"CS-710/free","tier":3,"rate":1,"q":"A car drives 60 km at 60 km/h and then another 60 km at 30 km/h. What is its average speed for the whole trip, in km/h?"},{"id":"CS-815/mcq","tier":3,"rate":1,"q":"Ben, a careful and honest man, borrows his neighbour\u0027s ladder, uses it to clean his gutters and puts it back exactly where it was. The next morning his neighbour finds the ladder broken on the ground after a storm blew it over during the night, which also knocked over several garden chairs in the street. Who most likely broke the ladder?\n\nA. cannot be determined\nB. Ben\nC. the neighbour\nD. a burgla\u2026"},{"id":"CS-816/mcq","tier":3,"rate":1,"q":"Pia pours a full litre of water into an empty 2-litre bottle, closes it tightly and lays it on its side in the freezer. After two days she takes it out. Ignoring the bottle itself, roughly how much does its content weigh now?\n\nA. about 0.9 kg\nB. about 1 kg\nC. about 1.1 kg\nD. about 2 kg"},{"id":"CS-040/altered-mcq","tier":3,"rate":1,"q":"Mia puts her keys into the red drawer and leaves the room. While she is away, Tom moves the keys to the blue drawer. Mia happens to watch this through the window, but Tom does not notice her. When Mia comes back, in which drawer will Mia look first?\n\nA. neither\nB. both are equally likely\nC. the blue drawer\nD. the red drawer"},{"id":"CS-905/mcq","tier":3,"rate":1,"q":"You stand on an open field facing north. Follow these instructions in order: turn 90 degrees right, walk 2 m forward, walk 1 m forward, walk 3 m forward, turn 90 degrees left, turn 90 degrees left, walk 3 m forward. In which direction are you facing at the end?\n\nA. north\nB. east\nC. south\nD. west"},{"id":"CS-905/free","tier":3,"rate":1,"q":"You stand on an open field facing north. Follow these instructions in order: turn 90 degrees right, walk 2 m forward, walk 1 m forward, walk 3 m forward, turn 90 degrees left, turn 90 degrees left, walk 3 m forward. In which direction are you facing at the end? Answer with north, east, south or west."},{"id":"NEW-004/free","tier":3,"rate":1,"q":"A drawer contains 10 black socks and 10 white socks, all mixed up. The room is completely dark, so you cannot see the colours. What is the smallest number of socks you must take out to be certain that you have two socks of the same colour?"},{"id":"NEW-017/free","tier":3,"rate":1,"q":"Walking at a steady pace, Maya needs 30 seconds to climb the stairs from the 1st floor to the 4th floor. All floors are the same height. At the same pace, how many seconds does she need from the 1st floor to the 8th floor?"},{"id":"NEW-052/mcq","tier":3,"rate":1,"q":"A heavy steel ball hangs on a string from the ceiling in the middle of a closed van. The van, which was standing still, suddenly accelerates hard forwards. In which direction does the ball swing, relative to the van?\n\nA. forwards\nB. backwards\nC. to the side\nD. it does not move"},{"id":"NEW-069/mcq","tier":3,"rate":1,"q":"Sam finds a closed paper bag in the kitchen that he has never seen before. He cannot see through the paper. The label on the bag says \u0022chocolate\u0022, but the bag is actually filled with popcorn. Sam reads the label and does not open the bag. What does Sam believe is in the bag?\n\nA. chocolate\nB. popcorn\nC. nothing\nD. cannot be determined"},{"id":"NEW-108/free","tier":3,"rate":1,"q":"A month has 30 days and begins on a Wednesday. How many Thursdays does this month have?"},{"id":"NEW-126/free","tier":3,"rate":1,"q":"Six books lie in a stack on a desk. From top to bottom their covers are: red, blue, green, yellow, white, black. The stack is now changed in these steps, one after another: the top book is moved to the bottom of the stack; the top three books are lifted off together, this small pile is turned upside down and put back on top; the bottom book is pulled out and put on top of the stack; the fourth boo\u2026"},{"id":"NEW-135/mcq","tier":3,"rate":1,"q":"Minutes of the committee meeting of the Lindenhof gardening club.\n\nPresent: Mrs Aydin (chair), Mr Bauer, Ms Costa, Mr Dietrich, Mrs Engel. Mr Falk sent his apologies.\n\n1. Summer party. The chair proposed Saturday, 14 June, starting at 15:00 on the club meadow. Mr Bauer pointed out that the brass band, which the club would like to book again, is only free on Sundays in June. After a short discussio\u2026"},{"id":"CS-110/altered-mcq","tier":3,"rate":0.917,"q":"A man points at a portrait and says: \u0022Brothers and sisters I have none, but this man\u0027s son is my father\u0027s son.\u0022 Who is in the portrait?\n\nA. the speaker\u0027s son\nB. the speaker himself\nC. the speaker\u0027s father\nD. the speaker\u0027s brother\nE. the speaker\u0027s grandfather"},{"id":"CS-112/altered-free","tier":3,"rate":0.917,"q":"5 machines need 5 minutes to make 5 widgets. How many minutes do 10 machines need to make 100 widgets?"},{"id":"CS-011/mcq","tier":3,"rate":0.917,"q":"Drying 5 shirts on a clothesline in the sun takes 4 hours. The clothesline has room for exactly 10 shirts at a time. Under the same conditions, what is the shortest time needed to dry 30 shirts?\n\nA. 4 hours\nB. 8 hours\nC. 12 hours\nD. 20 hours\nE. 24 hours"},{"id":"CS-801/free","tier":3,"rate":0.917,"q":"Lena, 31, is alone in a small changing room that is locked from the inside. She is trying on a red coat in front of a full-length mirror. In the mirror she sees a woman in a red coat with a large price tag still hanging from the left sleeve, and she thinks that this looks rather careless. Who should remove the price tag? Answer with the name."},{"id":"CS-805/mcq","tier":3,"rate":0.917,"q":"Five paper cups stand upright on a kitchen table, stacked inside each other; they slide apart easily. Ravi ties a string firmly to the rim of the top cup only. He slowly pulls the string straight up until that cup hangs freely in the air above the table, and then he walks with it out into the garden. How many cups are in the garden now?\n\nA. 0\nB. 1\nC. 4\nD. 5\nE. cannot be determined"},{"id":"CS-811/free","tier":3,"rate":0.917,"q":"A plane leaves Berlin at 10:00 local time and flies for 9 hours to New York. New York time is 6 hours behind Berlin time. What is the local time in New York when the plane lands? Answer as HH:MM."},{"id":"NEW-002/mcq","tier":3,"rate":0.917,"q":"In a game show there are three closed doors. Behind one door is a car, behind the other two are goats. You pick door 1. The host, who knows what is behind every door, then opens door 3 and shows a goat, as he always does in this show. He offers you to switch to door 2. What should you do to have the best chance of winning the car?\n\nA. switch to door 2\nB. stay with door 1\nC. it makes no difference"},{"id":"NEW-013/mcq","tier":3,"rate":0.917,"q":"A snail sits at the bottom of a well that is 10 metres deep. Each day it climbs up 3 metres, and each night it slides back 2 metres. On which day does it reach the top?\n\nA. on day 4\nB. on day 8\nC. on day 10\nD. it never reaches the top"},{"id":"NEW-021/free","tier":3,"rate":0.917,"q":"A bathtub has two taps. The first tap alone fills the empty tub in 20 minutes, the second tap alone fills it in 30 minutes. With the drain closed, how many minutes does it take to fill the empty tub when both taps are fully open?"},{"id":"NEW-035/free","tier":3,"rate":0.917,"q":"Buses run between four villages. The ride from A to B takes 20 minutes, from B to C 30 minutes, from A to C 60 minutes, from C to D 10 minutes and from B to D 50 minutes. Changing buses takes no time. What is the shortest possible travel time from A to D, in minutes?"},{"id":"NEW-042/mcq","tier":3,"rate":0.917,"q":"Four children were alone in the kitchen, and exactly one of them ate the cake. Ida says: \u0022It was Jan.\u0022 Jan says: \u0022It was Lea.\u0022 Kai says: \u0022It was not me.\u0022 Lea says: \u0022Jan is lying.\u0022 Exactly one of these four statements is true. Who ate the cake?\n\nA. Ida\nB. Jan\nC. Kai\nD. Lea"},{"id":"NEW-043/mcq","tier":3,"rate":0.917,"q":"Six people stand in a queue at a ticket counter. Cem stands directly in front of Dua. Exactly two people stand between Ada and Finn. Ben stands somewhere behind Eva. Eva is not at the front. Finn stands directly behind Ben. Ada stands further forward than Cem. Who is in fourth place, counted from the front?\n\nA. Ada\nB. Ben\nC. Cem\nD. Dua\nE. Eva\nF. Finn"},{"id":"NEW-048/free","tier":3,"rate":0.917,"q":"What is the smallest number of people that must be in a room so that you can be absolutely certain that at least two of them were born on the same day of the week?"},{"id":"NEW-065/free","tier":3,"rate":0.917,"q":"In a paddock stand 3 horses and a dog; all of them stand on all four legs. The farmer sits in the saddle of one of the horses, and his daughter stands next to him on the grass. How many legs are standing on the ground in total?"},{"id":"NEW-069/altered-mcq","tier":3,"rate":0.917,"q":"Sam finds a closed bag made of transparent plastic in the kitchen that he has never seen before. The label on the bag says \u0022chocolate\u0022, but everyone can plainly see through the plastic that the bag is filled with popcorn. Sam reads the label and looks at the bag. What does Sam believe is in the bag?\n\nA. chocolate\nB. popcorn\nC. nothing\nD. cannot be determined"},{"id":"NEW-071/read-mcq","tier":3,"rate":0.917,"q":"Before school, Lea puts a chocolate bar into the blue box in her room. During the morning her mother moves the chocolate into the kitchen drawer and sends Lea a text message about it. Lea reads the message on the bus on her way home. When Lea comes home, where will she look for the chocolate first?\n\nA. in the blue box\nB. in the kitchen drawer\nC. in her school locker\nD. cannot be determined"},{"id":"NEW-093/free","tier":3,"rate":0.917,"q":"You sit in a train on a seat that faces backwards, against the direction of travel. The train is travelling north. Through the window on your right you see a river. On which side of the railway line is the river? Answer with north, east, south or west."},{"id":"NEW-106/mcq","tier":3,"rate":0.917,"q":"A job takes exactly 10 working days. Work is done only from Monday to Friday. The job starts on a Wednesday morning, and that Wednesday counts as the first working day. On which day of the week is the job finished?\n\nA. Monday\nB. Tuesday\nC. Wednesday\nD. Thursday\nE. Friday\nF. Saturday\nG. Sunday"},{"id":"NEW-107/free","tier":3,"rate":0.917,"q":"A plane leaves Tokyo on a Monday at 18:00 local time and flies for 11 hours to Frankfurt. Frankfurt time is 8 hours behind Tokyo time. On which day of the week does it land, in Frankfurt local time? Answer with the day of the week."},{"id":"NEW-109/free","tier":3,"rate":0.917,"q":"A month has 31 days and begins on a Saturday. On which date of this month does the last Friday fall? Answer with the day of the month as a number."},{"id":"NEW-111/free","tier":3,"rate":0.917,"q":"Felix was born on 29 February 2000. Today is 1 March 2021. Not counting the day of his birth, on how many days has the calendar shown his exact birthday, 29 February, during his life so far?"},{"id":"NEW-129/free","tier":3,"rate":0.917,"q":"Three jugs without any markings stand on a table: jug A holds at most 8 litres, jug B at most 5 litres and jug C at most 3 litres. At the start A is full of water and B and C are empty. \u0027Pour from X into 26"},{"id":"CS-802/mcq","tier":3,"rate":0.75,"q":"On a warm summer evening, Tom puts six ice cubes into a large mug of freshly boiled tea. One minute later he adds two more ice cubes. Then he sets a timer, sits down on his balcony with the mug next to him and reads the newspaper for 15 minutes. How many ice cubes are in the mug when the timer rings?\n\nA. 8\nB. 6\nC. 4\nD. 2\nE. 0"},{"id":"CS-805/free","tier":3,"rate":0.75,"q":"Five paper cups stand upright on a kitchen table, stacked inside each other; they slide apart easily. Ravi ties a string firmly to the rim of the top cup only. He slowly pulls the string straight up until that cup hangs freely in the air above the table, and then he walks with it out into the garden. How many cups are in the garden now?"},{"id":"CS-813/mcq","tier":3,"rate":0.75,"q":"Jana sits in the back of a car holding a helium balloon on a short string. All windows are closed. The car brakes hard. In which direction does the balloon move relative to the car?\n\nA. forwards\nB. backwards\nC. it does not move\nD. straight down"},{"id":"CS-040/mcq","tier":3,"rate":0.75,"q":"Mia puts her keys into the red drawer and leaves the room. While she is away, Tom moves the keys to the blue drawer. Mia happens to watch this through the window, but Tom does not notice her. When Mia comes back, in which drawer does Tom expect her to look first?\n\nA. neither\nB. both are equally likely\nC. the blue drawer\nD. the red drawer"},{"id":"CS-022/free","tier":3,"rate":0.75,"q":"A solid 3\u00D73\u00D73 cube is built from 27 small cubes. Only the top face and the bottom face of the large cube are painted red. How many of the small cubes have no paint at all?"},{"id":"CS-906/mcq","tier":3,"rate":0.75,"q":"You stand on an open field facing north. Follow these instructions in order: walk 1 m forward, walk 2 m forward, turn 90 degrees left, walk 1 m forward, turn 90 degrees right, turn 90 degrees left, turn 90 degrees left, walk 1 m forward, walk 1 m forward, turn 90 ples. She also packed paper plates, a knife, salt and a thermos flask of coffee into a wicker basket, which\u2026"},{"id":"NEW-087/mcq","tier":3,"rate":0,"q":"A man lies flat on his back, looking up at the ceiling, on the floor, with his head pointing north and his arms stretched out sideways. In which direction does his right hand point?\n\nA. north\nB. east\nC. south\nD. west"},{"id":"T4-007/mcq","tier":4,"rate":1,"q":"Emre works the night shift as the only security guard in a locked office building. Shortly after midnight he sits in the control room in front of a row of monitors, his red thermos flask next to the keyboard, and eats an apple, although the company rules strictly forbid eating at the desk. That afternoon an electrician installed one more camera, and nobody has told Emre where it is mounted. Its li\u2026"},{"id":"T4-014/mcq","tier":4,"rate":1,"q":"On Monday Mrs Roth plants 6 apple seeds in a row along her garden fence, 3 metres apart. She has read that a mature apple tree of this variety bears about 80 apples every autumn. Every evening she waters each seed with 2 litres of water. How many apples can she pick from these 6 plants on Friday of the same week?\n\nA. 0\nB. 80\nC. 96\nD. 480\nE. 2400"},{"id":"T4-016/altered-mcq","tier":4,"rate":1,"q":"Karl wants a bath. His bathtub holds exactly 150 litres up to the rim. He closes the drain and opens the tap, which delivers 10 litres per minute. Then the doorbell rings; his neighbour needs help with a wardrobe, and Karl forgets the bath. Exactly 60 minutes after opening the tap he rushes back into the bathroom and turns it off. How many litres of water are in the bathtub at that moment?\n\nA. 0 l\u2026"},{"id":"T4-019/mcq","tier":4,"rate":1,"q":"Lukas comes back from two weeks of hiking in the mountains, where he had no phone reception at all. His sister picks him up at the station and tells him the news in one breath: his football club has been relegated; the neighbour\u0027s boy has scratched the door of his car; his former girlfriend Jana is now engaged to his best friend; and, oh yes, the old dam above the town broke last Tuesday, his stre\u2026"},{"id":"T4-042/mcq","tier":4,"rate":1,"q":"At a meeting 10 people greet one another: everybody shakes hands exactly once with every other person. Mr Kaya is one of the ten. In how many handshakes does Mr Kaya himself take part?\n\nA. 9\nB. 10\nC. 20\nD. 45\nE. 90"},{"id":"T4-005/mcq","tier":4,"rate":0.917,"q":"In the cup final the striker Marco plays the match of his life: he scores in the 4th minute and again in the 8th minute, a goal every four minutes. In the 10th minute he fouls the goalkeeper, is shown the red card and walks off the pitch. The match lasts the regular 90 minutes, and his team wins 5:3 in the end. How many goals does Marco score in this match?\n\nA. 2\nB. 3\nC. 5\nD. 20\nE. 22"},{"id":"T4-020/mcq","tier":4,"rate":0.917,"q":"Lisa keeps a paper diary. She writes exactly one page every day and uses both sides of every sheet; the entry for 1 March is on the front of the first sheet, the entry for 2 March on its back, and so on without a gap. Years later she is so embarrassed by what she wrote on 14 March that she tears the sheet with this entry out of the diary and burns it. Of how many days are the entries now missing f\u2026"},{"id":"T4-024/mcq","tier":4,"rate":0.917,"q":"At 10:00, at low tide, three children build 6 sandcastles on the wet sand, 2 metres from the water\u0027s edge, and decorate each of them with 4 shells. The tide table at the kiosk says: high tide at 16:00; the sea then reaches all the way up to the foot of the dunes, 40 metres further up the beach. The family goes to lunch and to the playground and comes back to the same spot at 18:30, when the water \u2026"},{"id":"T4-025/mcq","tier":4,"rate":0.917,"q":"In a house there are four containers: a laundry basket in the bedroom, a backpack in the hallway, a shoebox in the study and a pencil case in the kitchen; all four are empty at the start. Five small things lie on the floor: a key in the hallway, a coin in the kitchen, a ring in the bedroom, a ticket in the study and a watch in the garage. A container is always closed before it is moved, so everyth\u2026"},{"id":"T4-003/mcq","tier":4,"rate":0.833,"q":"Anna is cooking a three-course dinner in her flat on Saturday for her 6 closest friends from university. On Thursday Tom cancels because he has the flu. On Friday Mira asks whether she may bring her new boyfriend, and Anna happily agrees. Anna\u0027s husband is abroad on business all week, and the cat Mimi will, as always, watch from the windowsill. Everybody who is there on Saturday evening eats all t\u2026"},{"id":"T4-013/altered-mcq","tier":4,"rate":0.833,"q":"Four colleagues live in the same street and work in the same office, which is 30 km away. Each of them owns a car that uses exactly 6 litres of petrol per 100 km. Since Monday they have been saving money: all four ride together in Tom\u0027s car, and the other three cars stay at home. How many litres of petrol are used in total to bring all four colleagues from their street to the office on Tuesday mor\u2026"},{"id":"T4-015/mcq","tier":4,"rate":0.833,"q":"In the unlit garden of a Berlin museum stands an old sundial. At 15:00 on a clear, sunny day shortly before Christmas its shadow falls exactly on the Roman numeral III, and a visitor observes that the shadow moves on by one numeral every hour. The sky stays cloudless all day and all night, and there is no moon that night. What does the sundial show five hours later, at 20:00?\n\nA. the numeral VII\nB\u2026"},{"id":"T4-017/mcq","tier":4,"rate":0.833,"q":"Tina is 46, works in an office and has never trained for running. At the company sports day she sprints 100 metres in 15 seconds, and her colleagues talk her into entering the city marathon next month (42.195 km). One of them calculates that at her sprint speed she would need 1 hour and 45 minutes for the whole distance. If Tina really runs and reaches the finish, which finishing time is the most \u2026"},{"id":"T4-018/altered-mcq","tier":4,"rate":0.833,"q":"On a moonless winter evening five friends sit in the windowless reading room of a mountain hut, each with a book: Ida with a crime novel, Omar with a cookbook, Pia with a travel guide, Sven with a volume of poems, and Hanna, who has been blind since birth, with a novel in Braille. All mobile phones lie switched off in a basket in the hall, as the hut rules demand, and there are no candles, lighter\u2026"},{"id":"T4-027/free","tier":4,"rate":0.833,"q":"Five chairs stand in a row in front of the blackboard. Seen from the teacher, who faces the row, they are numbered 1 to 5 from left to right, and \u0027to the right\u0027 always means towards the higher numbers. At the start Ali sits on chair 1, Bea on chair 2, Cem on chair 3, Dua on chair 4 and Eli on chair 5. Then the following happens, step by step: Cem and Ali swap places; Dua swaps places with the chil\u2026"},{"id":"T4-036/mcq","tier":4,"rate":0.833,"q":"On Monday Mrs Kern hides the birthday present for her son Leo in the garage. Leo\u0027s sister Pia happens to watch her through the kitchen window; Mrs Kern does not notice. On Tuesday morning, while both children are at school, Mrs Kern has second thoughts and moves the present to the attic. On Tuesday evening she phones her husband, who is away on a business trip, and tells him that the present is no\u2026"},{"id":"T4-037/mcq","tier":4,"rate":0.833,"q":"The under-15 football team has trained every Thursday at 17:00 on pitch A for years. This Thursday at 14:00 the coach writes in the team\u0027s group chat: \u0022Today we start one hour later, at 18:00, and on pitch B.\u0022 Ali reads the message at once. Bo\u0027s phone has been dead since noon, and he goes to training straight from his grandmother\u0027s without having seen anything. Cem reads the message in the afterno\u2026"},{"id":"T4-039/mcq","tier":4,"rate":0.833,"q":"In the morning all four flatmates, Anna, Ben, Cleo and Dora, are in the kitchen when Anna puts a bar of chocolate into the red tin. Then Dora leaves for work. Ben moves the chocolate into the blue jar while Anna and Cleo watch. Anna goes to take a shower. Cleo moves the chocolate into the top drawer; Ben sees it. Ben leaves for the gym. When Anna comes back from the shower, Cleo tells her as a jok\u2026"},{"id":"T4-040/mcq","tier":4,"rate":0.833,"q":"A rapid test for a rare infection gives the correct result in 99 % of all cases, for infected and for healthy people alike. 1 % of the population are infected. Anna\u0027s rapid test is positive. Two days later the hospital examines her blood with a laboratory method that is never wrong, and the result shows without any doubt that Anna is not infected. What is the probability that Anna is infected?\n\nA.\u2026"},{"id":"T4-043/mcq","tier":4,"rate":0.833,"q":"Tom usually reads 20 pages a day. His new novel has 300 pages. He reads the first page on 1 March, reads some pages on every single day, and finishes the last page on 10 March. How many pages per day did Tom read on average while he was reading this novel?\n\nA. 15\nB. 20\nC. 30\nD. 33\nE. 300"},{"id":"T4-044/free","tier":4,"rate":0.833,"q":"Subject: Saturday\u0027s autumn walk \u2013 please read to the end!\n\nDear walking friends,\n\nhere are the details for our autumn walk next Saturday. Thank you to the 17 of you who have signed up; with Gerd and me as leaders we will be 19, so we just fit onto one group ticket (maximum 20 people, 9 euros each).\n\nWe meet at 7:50 at the main station under the big clock. Our train leaves at 8:12 from platform 3 a\u2026"},{"id":"T4-004/altered-mcq","tier":4,"rate":0.75,"q":"Rex, a young sheepdog who loves balls, is tied to the lamp post with a 2-metre leash in front of the bakery while Sam is inside buying rolls. A boy on the pavement kicks a ball, which comes to rest exactly 12 metres away from the lamp post. Rex can sprint at 6 metres per second. Nobody helps him, and the knot and his collar hold firmly. How long does it take until Rex has the ball in his mouth?\n\nA\u2026"},{"id":"T4-008/mcq","tier":4,"rate":0.75,"q":"A coach with a tour group stops for half an hour at a waterfall. Before the stop the guide counted 31 passengers. One of them is Ms Lin, who is 1.60 m tall, has long black hair and wears glasses and a blue jacket. At the kiosk a cup of coffee is spilled over her jacket, so in the washroom she changes into the red raincoat from her bag, ties her hair back and puts her fogged-up glasses into her poc\u2026"},{"id":"T4-009/mcq","tier":4,"rate":0.75,"q":"Sofia prints her 10-page report on 10 separate sheets, one page per sheet. Pages 1 to 4, the summary, she staples together in the top left corner; pages 5 to 10 lie loose in a folder. Her boss phones and wants to see only page 2 and page 7 in his office. Sofia has no staple remover at hand and does not want to tear anything, so she takes as few sheets as possible to him and leaves everything else \u2026"},{"id":"T4-010/mcq","tier":4,"rate":0.75,"q":"Eva keeps exactly three keys on a single key ring: her house key, her car key and the key of her bicycle lock. On Friday evening her brother Jan borrows her car for the weekend. He is late, so Eva simply presses the key ring into his hand at the front door, and he drives 300 km to Munich. Later her flatmate lets her back into the flat. On Saturday morning the weather is perfect, 22 \u00B0C and no wind,\u2026"},{"id":"T4-011/mcq","tier":4,"rate":0.75,"q":"A stream flows at a steady 1 metre per second from the old mill down through the village and on into the lake. Tim stands on the village bridge, 300 metres from the mill, sets a paper boat onto the water and immediately runs up the path along the stream to the mill at 5 metres per second, because he wants to see his boat arrive there. How long after the launch does the paper boat arrive at the mil\u2026"},{"id":"T4-021/mcq","tier":4,"rate":0.75,"q":"Before a hike Ben fills his 750 ml drinking bottle to the brim. He cannot find the cap, so he pushes the open bottle, with the opening pointing down, into the mesh side pocket of his rucksack and sets off at once. He walks uphill for two hours and normally drinks 250 ml per hour, but this time he is so busy talking that he does not drink at all on the way. How many millilitres of water can Ben dri\u2026"},{"id":"T4-022/mcq","tier":4,"rate":0.75,"q":"Nora has breakfast in the garden on a windless morning. On the table lies a neat pile of 20 paper napkins. The honey jar has been dripping, and its whole underside is smeared with sticky honey when Nora puts it down on top of the pile. After breakfast she grasps the jar with one hand, carries it into the kitchen and puts it into the cupboard without looking at it. Nobody touches the napkins. How m\u2026"},{"id":"T4-023/mcq","tier":4,"rate":0.75,"q":"Mia rides up a 20-metre-long escalator that moves at 0.5 metres per second; she stands still on her step the whole way. Right at the bottom her scarf slips from her shoulders and lands on the step directly behind her, without her noticing. Nobody else is on the escalator. Where is the scarf at the moment when Mia steps off at the top?\n\nA. already carried back down to the bottom\nB. on the step dire\u2026"},{"id":"T4-025/free","tier":4,"rate":0.75,"q":"In a house there are four containers: a laundry basket in the bedroom, a backpack in the hallway, a shoebox in the study and a pencil case in the kitchen; all four are empty at the start. Five small things lie on the floor: a key in the hallway, a coin in the kitchen, a ring in the bedroom, a ticket in the study and a watch in the garage. A container is always closed before it is moved, so everyth\u2026"},{"id":"T4-033/free","tier":4,"rate":0.75,"q":"Tim stands in front of the town hall and holds a city map upside down, so that south is at the top of the sheet as he looks at it. On the sheet as he holds it, the church appears exactly to the left of the town hall. In which compass direction from the town hall does the church really lie? Answer with north, east, south or west."},{"id":"T4-034/free","tier":4,"rate":0.75,"q":"The owner of a caf\u00E9 has had the name TOM painted in large capital letters on the outside of the shop window, so that it can be read from the street. A guest sits inside the caf\u00E9 and looks out through this window. Which sequence of letters does the guest see on the glass, read from left to right? Answer with the letters only."},{"id":"T4-041/mcq","tier":4,"rate":0.75,"q":"It is well known that in a group of 23 randomly chosen people the probability that at least two of them have their birthday on the same day of the year is about 50 %. Class 7b has exactly 23 pupils, among them the twin sisters Mia and Lea, who were born on the same afternoon. What is the probability that at least two pupils of class 7b have their birthday on the same day of the year?\n\nA. about 6 %\u2026"},{"id":"T4-045/free","tier":4,"rate":0.75,"q":"Notes from the planning evening for the Lindenstrasse street party (written up by Hatice, treasurer)\n\nWe were nine people in Uwe\u0027s garage and it took three hours, so here is the short version, which is still long.\n\nDate and place: Saturday, 6 September, from 15:00, on the street between house numbers 4 and 22. The council charges 60 euros for closing the street and wants the form by 1 August. Uwe \u2026"},{"id":"T4-012/mcq","tier":4,"rate":0.667,"q":"On a rainy Sunday the brothers Jonas and Lukas play table tennis in the garage, just the two of them against each other. Jonas plays 7 sets and wins 4 of them; Lukas also plays 7 sets. Every set lasts exactly 6 minutes, and they take no breaks. For how many minutes do the brothers play table tennis that afternoon?\n\nA. 18\nB. 24\nC. 42\nD. 84\nE. 168"},{"id":"T4-026/mcq","tier":4,"rate":0.667,"q":"In a house there are four containers: a laundry basket in the bedroom, a backpack in the hallwa  evening for the Lindenstrasse street party (written up by Hatice, treasurer)\n\nWe were nine people in Uwe\u0027s garage and it took three hours, so here is the short version, which is still long.\n\nDate and place: Saturday, 6 September, from 15:00, on the street between house numbers 4 and 22. The council charges 60 euros for closing the street and wants the form by 1 August. Uwe \u2026"},{"id":"T4-029/free","tier":4,"rate":0.417,"q":"A standard die lies on a table. Opposite faces add up to 7. The 1 is on top, the 2 faces north and the 3 faces east. Tipping the die towards the north means that it rolls over its northern bottom edge, so that the face that was on top then faces north. Turning it clockwise as seen from above means that the top face stays on top and the face that pointed north then points east. The following is don\u2026"},{"id":"T4-032/mcq","tier":4,"rate":0.417,"q":"Lea does a handstand on the lawn. While she is upside down, her belly faces north and her back faces south. Her two hands stand on the grass half a metre apart. In which compass direction from her left hand is her right hand?\n\nA. north\nB. east\nC. south\nD. west"},{"id":"T4-034/mcq","tier":4,"rate":0.417,"q":"The owner of a caf\u00E9 has had the name TOM painted in large capital letters on the outside of the shop window, so that it can be read from the street. A guest sits inside the caf\u00E9 and looks out through this window. Which sequence of letters does the guest see on the glass, read from left to right?\n\nA. WOT\nB. TOW\nC. TOM\nD. MOT"},{"id":"T4-035/free","tier":4,"rate":0.417,"q":"Nine people stand in a circle, all facing outwards, with their backs to the centre. Seen from above, they stand in counterclockwise order: Ines, Jonas, Kira, Lars, Mona, Nico, Olga, Paul, Rosa (after Rosa comes Ines again). Then Kira and Paul swap places. Who is now the fourth person on Mona\u0027s right (the person standing three places beyond Mona\u0027s direct neighbour on her right-hand side), from Mona\u2026"},{"id":"T4-006/mcq","tier":4,"rate":0.333,"q":"Before sunrise Jonas walks alone to the small frozen pond behind his village. Fresh snow has fallen during the night, and when he arrives the path around the pond is completely untouched: not a single footprint anywhere. To warm up he starts walking round and round the pond in his new winter boots, size 44. After a few minutes he notices a line of fresh boot prints in the snow in front of him, lea\u2026"},{"id":"T4-030/free","tier":4,"rate":0.333,"q":"A standard die lies on a table. Opposite faces add up to 7. The 1 is on top, the 2 faces north and the 3 faces east. Tipping the die towards the north means that it rolls over its northern bottom edge, so that the face that was on top then faces north. Turning it clockwise as seen from above means that the top face stays on top and the face that pointed north then points east. The following is don\u2026"},{"id":"T4-032/free","tier":4,"rate":0.333,"q":"Lea does a handstand on the lawn. While she is upside down, her belly faces north and her back faces south. Her two hands stand on the grass half a metre apart. In which compass direction from her left hand is her right hand? Answer with north, east, south or west."},{"id":"T4-035/mcq","tier":4,"rate":0.333,"q":"Nine people stand in a circle, all facing outwards, with their backs to the centre. Seen from above, they stand in counterclockwise order: Ines, Jonas, Kira, Lars, Mona, Nico, Olga, Paul, Rosa (after Rosa comes Ines again). Then Kira and Paul swap places. Who is now the fourth person on Mona\u0027s right (the person standing three places beyond Mona\u0027s direct neighbour on her right-hand side), from Mona\u2026"},{"id":"T4-031/mcq","tier":4,"rate":0.25,"q":"Paul lies on his left side on a picnic blanket in a meadow, stretched out straight, with his head pointing east and his feet pointing west. A beetle sits in the grass exactly in front of his nose, 30 cm away from it. In which compass direction from Paul\u0027s nose is the beetle?\n\nA. north\nB. east\nC. south\nD. west"},{"id":"T4-031/free","tier":4,"rate":0.25,"q":"Paul lies on his left side on a picnic blanket in a meadow, stretched out straight, with his head pointing east and his feet pointing west. A beetle sits in the grass exactly in front of his nose, 30 cm away from it. In which compass direction from Paul\u0027s nose is the beetle? Answer with north, east, south or west."},{"id":"T4-001/mcq","tier":4,"rate":0.167,"q":"Lena buys a pack of 12 small fridge magnets shaped like lemons. At home she presses 7 of them onto the solid oak door of her wardrobe, one on top of each of her 7 holiday postcards, and the other 5 onto the door of her refrigerator, where they hold her shopping lists. On Sunday she decides that the wardrobe deserves more colour, takes 2 magnets from the refrigerator and presses them onto the wardr\u2026"},{"id":"T5-007/free","tier":5,"rate":1,"q":"Tom lies on his stomach on a picnic blanket, his head pointing north and his feet pointing south. Lena stands at his head and looks along his body towards his feet. Tom holds a phone in his left hand, with the arm stretched out sideways. From Lena\u0027s point of view, is the phone on her left or on her right? Answer with one word: left or right."},{"id":"T5-037/free","tier":5,"rate":1,"q":"For the class trip the school rents 3 minibuses. Each minibus has exactly 9 seats, the driver\u0027s seat included, and every person needs a seat of his or her own. The only adults who come along are the three teachers Ms Roth, Mr Kaya and Ms Lindner, and all three hold the driving licence for such a minibus. What is the largest number of pupils who can go on the trip? Give the number."},{"id":"T5-042/free","tier":5,"rate":0.917,"q":"Mrs Kunz keeps 15 chickens in her garden: 8 hens, 2 roosters and 5 chicks that hatched last week. A hen of her breed lays one egg every day. She collects all the eggs of one week, from Monday to Sunday, and packs them into boxes of 6 for the market. How many full boxes does she get? Give the number."},{"id":"T5-030/free","tier":5,"rate":0.833,"q":"Six customers stand in a queue at the bakery counter. From the front to the back they are: Olga, Pavel, Rosa, Sami, Tina and Udo. Then the following happens, in this order: Tina pushes in two places further forward; Olga, at the front, is served and leaves the shop; Pavel lets the person directly behind go ahead; Tina remembers something, steps out of the queue and joins it again at the very end; \u2026"},{"id":"T5-034/free","tier":5,"rate":0.833,"q":"For his birthday party on a hot July afternoon Jan buys a box of 10 ice lollies. At home only 3 of them fit into the crammed freezer; the other 7 stay in the shopping bag on the sunny balcony, where he forgets them. Three hours later his 6 guests have finished the cake, and Jan wants to hand each guest one properly frozen ice lolly, first from the freezer and then from the bag. How many guests get\u2026"},{"id":"T5-035/free","tier":5,"rate":0.833,"q":"Tom\u0027s bowl of steaming hot soup contains 7 meatballs and 12 slices of carrot. Because the soup is far too hot to eat, he drops in 4 ice cubes from the freezer and then takes a phone call. Ten minutes later, when the soup is pleasantly warm, he lifts every solid piece out of the bowl with his spoon, one at a time, and counts aloud. Which number does he reach? Give the number."},{"id":"T5-036/free","tier":5,"rate":0.833,"q":"On election Sunday the turnout in the house at Lindenweg 4 is 100 %: everybody who lives there and is entitled to vote goes to the polling station and puts exactly one ballot paper into the box. On the ground floor live Mr and Mrs Demir with their children Elif (12), Can (9) and Mert (4). On the first floor lives Mrs Vogel, an 81-year-old widow. On the second floor live the students Jonas (23) and\u2026"},{"id":"T5-038/free","tier":5,"rate":0.833,"q":"This morning a postman has 30 items for Birkenweg in his bag: 18 letters in sealed envelopes and 12 picture postcards. He delivers 5 of the sealed letters and 4 of the postcards in the first half of the street and then sits down on a bench for his break. He is a very curious man, but he would never open an envelope. How many of the messages that are still in his bag could he read during his break?\u2026"},{"id":"T5-040/free","tier":5,"rate":0.833,"q":"On the garden fence sit 9 sparrows; between them stand 3 painted garden gnomes that the children have put there; and on the lawn below, 2 blackbirds are looking for worms. Mr Hoff comes out of the house and claps his hands loudly three times. One minute later, how many of these fourteen are most likely still in the place where they were? Give the number."},{"id":"T5-044/free","tier":5,"rate":0.833,"q":"The day before the day that comes three days after the day before yesterday is a Friday. Which day of the week is the day after the day that comes four days before the day after tomorrow? Answer with the name of the weekday."},{"id":"T5-046/free","tier":5,"rate":0.833,"q":"An old machine in a museum has 10 wheels, numbered 1 to 10, all mounted on the same wall and all seen from the same side. They are connected like this: wheel 1 is a gear whose teeth mesh directly with the teeth of wheel 2; wheel 2 drives wheel 3 with a crossed belt that runs in the shape of a figure eight; wheel 3 drives wheel 4 with a crossed belt that runs in the shape of a figure eight; wheel 4\u2026"},{"id":"T5-047/free","tier":5,"rate":0.833,"q":"An old machine in a museum has 12 wheels, numbered 1 to 12, all mounted on the same wall and all seen from the same side. They are connected like this: wheel 1 is a gear whose teeth mesh directly with the teeth of wheel 2; wheel 2 drives wheel 3 with a crossed belt that runs in the shape of a figure eight; wheel 3 is a gear whose teeth mesh directly with the teeth of wheel 4; wheel 4 is fixed on t\u2026"},{"id":"T5-016/free","tier":5,"rate":0.75,"q":"Ben rows a small boat straight north across a lake. As rowers do, he sits with his back to the direction of travel. His sister sits in the stern of the boat and faces him, looking in the direction of travel. She points to a heron that stands on the shore exactly on her left. From Ben\u0027s point of view, is the heron on his left or on his right? Answer with one word: left or right."},{"id":"T5-018/free","tier":5,"rate":0.75,"q":"In a barber\u0027s shop a round wall clock without numerals hangs on the wall behind the customer, who can see it only in the big mirror in front of him. In the mirror the clock appears to show 4:40. The barber mentions that this clock is exactly 25 minutes fast. It is morning. What is the correct time? Answer as H:MM."},{"id":"T5-003/free","tier":5,"rate":0.667,"q":"On the beach Jon lies flat on his stomach, face down, with his head pointing west and his feet pointing east, and stretches both arms straight out sideways. In which compass direction does his left hand point? Answer with one word: north, east, south or west."},{"id":"T5-012/free","tier":5,"rate":0.667,"q":"A dentist has had the word MOUTH painted in large capital letters on the outside of the glass door of her practice, so that it can be read from the street. A patient sits in the waiting room inside and looks out through this door. Which sequence of letters does the patient see on the glass, read from left to right? Answer with the five letters as one word."},{"id":"T5-015/free","tier":5,"rate":0.667,"q":"Tim stands next to the fountain in the market square and holds his city map turned in such a way that the western edge of the map is at the top as he looks at it. On the sheet as he holds it, the bakery appears exactly to the right of the fountain. Tim himself is facing south. Where is the bakery from Tim\u0027s point of view? Answer with one word: ahead, behind, left or right."},{"id":"T5-032/free","tier":5,"rate":0.667,"q":"For the school fete the caretaker ties 20 balloons to the fence of the spo     D.cells[ri].forEach((cell, ci) => {
      ctx.fillStyle = cell ? D.colors[cell[0]] : D.colors[0];
      ctx.fillRect(LABEL + (D.xs[ci] + 1) * z, y + z, D.square * z, D.square * z);
    });
  });
  const cy = TOP + rows * p + GAP * z;
  ctx.fillStyle = '#ddd'; ctx.fillText('solve rate (all runs)', 4, cy + p / 2, LABEL - 8);
  D.cols.forEach((c, ci) => { ctx.fillStyle = gray(c.rate); ctx.fillRect(LABEL + (D.xs[ci] + 1) * z, cy + z, D.square * z, D.square * z); });
}
function colAt(x){
  const u = (x - LABEL) / z; let lo = 0, hi = D.xs.length - 1, best = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (D.xs[m] <= u) { best = m; lo = m + 1; } else hi = m - 1; }
  return best >= 0 && u < D.xs[best] + D.pitch ? best : -1;
}
cv.addEventListener('mousemove', ev => {
  const b = cv.getBoundingClientRect(), x = ev.clientX - b.left, y = ev.clientY - b.top, p = D.pitch * z;
  const ci = colAt(x), ri = Math.floor((y - TOP) / p), cy = TOP + D.rows.length * p + GAP * z;
  if (ci < 0) { tip.style.display = 'none'; return; }
  const c = D.cols[ci]; let t = `${c.id}  (tier ${c.tier}, solved by ${Math.round(c.rate * 100)} % of the runs)\n\n${c.q}`;
  if (ri >= 0 && ri < D.rows.length) {
    const cell = D.cells[ri][ci], r = D.rows[ri];
    t = `${r.name}\n` + (cell ? `${D.legend[cell[0]]}\nanswer: ${cell[3]}\nexpected: ${cell[4]}\n${cell[1]} tokens, ${cell[2]} s\n\n` : 'not answered\n\n') + t;
  } else if (!(y >= cy && y < cy + p)) { tip.style.display = 'none'; return; }
  tip.textContent = t; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - 540) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
});
cv.addEventListener('mouseleave', () => tip.style.display = 'none');
document.getElementById('zoom').addEventListener('change', e => { z = +e.target.value; draw(); });
draw();
</script></body></html>
